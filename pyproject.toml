[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indicator-system-modelling"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[project.scripts]
run-fastapi = "run_fastapi:main"

[tool.setuptools]
py-modules = ["run_fastapi"]

[tool.setuptools.packages.find]
where = ["."]