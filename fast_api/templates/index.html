<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Soil Health & Food Affordability</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden; /* ✅ no scrolling anywhere */
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }

    :root { --base-font: 15px; }
    body { font-size: var(--base-font); }

    .app{
      height: 100vh;
      display: grid;
      grid-template-rows: 44px 1fr;
      background: linear-gradient(to top, #bdecb6 0%, #ffffff 70%);
    }

    .header{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 10px;
      border-bottom: 1px solid rgba(0,0,0,0.12);
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(6px);
    }

    .header .title{ font-weight: 700; font-size: 13px; }

    .btn{
      background: #222;
      color: #fff;
      border: 1px solid #000;
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }

    .plot-select{
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.25);
      background: rgba(255,255,255,0.95);
      font-size: 12px;
      cursor: pointer;
    }

    /* MAIN CONTENT: half-page width, centered, no scroll */
    .content{
      width: 50vw;                 /* 👈 half the page width */
      max-width: 820px;            /* optional cap so it doesn't get too huge */
      min-width: 520px;            /* optional floor so it doesn't get too tiny */
      margin-right: auto;              /* center it */
      margin-left: 20px;
      padding: 10px;
      height: calc(100vh - 44px);  /* fill remaining height under header */
      display: grid;
      grid-template-rows: 1fr auto; /* soil card + (optional) secondary card */
      gap: 10px;
    }

    .card{
      border: 1px solid rgba(0,0,0,0.14);
      border-radius: 10px;
      background: rgba(255,255,255,0.65);
      box-shadow: 0 1px 6px rgba(0,0,0,0.05);
      padding: 6px;
      min-width: 0;
      min-height: 0;
    }

    /* Soil should fill the available "main" area */
    #soilCard { min-height: 0; }

    /* Secondary plot is hidden by default */
    #secondaryCard { display: none; }

    .plot{
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
    }

    /* Modal overlay + panel */
    .modal-overlay{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.30);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .modal-overlay.open{ display: flex; }

    .modal{
      width: min(980px, 94vw);
      max-height: 86vh;
      overflow: auto; /* modal itself can scroll internally */
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(10px) saturate(120%);
      -webkit-backdrop-filter: blur(10px) saturate(120%);
      border: 1px solid rgba(0,0,0,0.18);
      border-radius: 14px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.25);
      padding: 12px;
    }

    .modal-header{
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 10px;
    }

    .modal-title{ font-weight: 800; font-size: 14px; }

    .grid-controls{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      min-width: 0;
    }

    .control{
      border: 1px solid rgba(0,0,0,0.10);
      border-radius: 12px;
      padding: 10px;
      background: rgba(255,255,255,0.75);
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .control h4{ margin: 0; font-size: 13px; }
    .row{ display: grid; gap: 4px; min-width:0; }
    .labelrow{ display: flex; justify-content: space-between; font-size: 12px; gap: 10px; }
    input[type="range"]{ width: 100%; }
    input[type="text"]{
      width: 100%;
      padding: 6px 8px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.18);
      min-width: 0;
    }
    select{
      width:100%;
      padding:6px 8px;
      border-radius:10px;
      border:1px solid rgba(0,0,0,0.18);
      background: rgba(255,255,255,0.95);
    }
    .small{ font-size: 12px; color: #333; }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <div class="title">Soil Health & Food Affordability — Dashboard</div>
      <div style="display:flex; gap:8px; align-items:center;">
        <button class="btn" id="openControls">Controls</button>
        <button class="btn" onclick="window.open('/paper')">Paper</button>

        <!-- start with NONE -->
        <select id="plotSelect" class="plot-select">
          <option value="none" selected>(show only Soil)</option>
          <option value="prod">Production</option>
          <option value="pop">Population</option>
          <option value="ssr">Self-sufficiency</option>
          <option value="inc">Real income</option>
          <option value="aff">Affordability index</option>
          <option value="deg">Degradation</option>
          <option value="price">Price</option>
          <option value="harvest">Harvest</option>
        </select>
      </div>
    </div>

    <div class="content" id="content">
      <div class="card" id="soilCard">
        <div id="plotSoil" class="plot"></div>
      </div>

      <div class="card" id="secondaryCard">
        <div id="plotMain" class="plot"></div>
      </div>
    </div>
  </div>


  <!-- Modal overlay -->
  <div class="modal-overlay" id="overlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <div class="modal-title">Simulation controls</div>
        <button class="btn" id="closeControls">Close ✖</button>
      </div>

      <div class="grid-controls">
        <div class="control">
          <h4>Global</h4>

          <div class="row">
            <div class="labelrow"><span><b>T_max</b></span><span id="tmaxLabel" class="small"></span></div>
            <input id="tmax" type="range" min="10" max="250" step="10" value="50">
          </div>

          <div class="row">
            <div class="labelrow"><span><b>Pop growth</b></span><span id="popLabel" class="small"></span></div>
            <input id="pop" type="range" min="0" max="0.1" step="0.005" value="0.02">
          </div>

          <div class="row">
            <div class="labelrow"><span><b>n_points</b></span><span id="nLabel" class="small"></span></div>
            <input id="n" type="range" min="120" max="600" step="30" value="300">
          </div>
        </div>

        <div class="control" style="grid-column: 1 / -1;">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
            <h4 style="margin:0;">Lands</h4>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              <button class="btn" id="addLandBtn" type="button">+ Add land</button>
              <button class="btn" id="removeLandBtn" type="button">- Remove last</button>
            </div>
          </div>

          <div id="landsContainer" class="grid-controls" style="grid-template-columns: 1fr 1fr; margin-top:8px;"></div>
          <div class="small">Each land uses “Constant degradation D” for now (D_const per land).</div>
        </div>
      </div>
    </div>
  </div>

<script>
const el = (id) => document.getElementById(id);

// Modal open/close
const overlay = el("overlay");
el("openControls").addEventListener("click", () => overlay.classList.add("open"));
el("closeControls").addEventListener("click", () => overlay.classList.remove("open"));
overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.classList.remove("open"); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") overlay.classList.remove("open"); });

// ---- state ----
let selectedPlot = "none";

let landsState = [{
  name: "Land 1",
  share: 50,
  alpha: 0.20,
  s0: 0.80,
  pmax: 10.0,
  dconst: 0.10,
  recovery: "Constant alpha",
  alpha_max: 0.25,
  sT: 0.20,
  rho: 50
}];

function setGlobalLabels(){
  el("tmaxLabel").textContent = el("tmax").value + " yrs";
  el("popLabel").textContent  = (+el("pop").value).toFixed(3);
  el("nLabel").textContent    = el("n").value;
}

function setLandLabels(i){
  if (el(`shareLabel_${i}`)) el(`shareLabel_${i}`).textContent = `${landsState[i].share}%`;
  if (el(`alphaLabel_${i}`)) el(`alphaLabel_${i}`).textContent = landsState[i].alpha.toFixed(2);
  if (el(`s0Label_${i}`))    el(`s0Label_${i}`).textContent    = landsState[i].s0.toFixed(2);
  if (el(`pmaxLabel_${i}`))  el(`pmaxLabel_${i}`).textContent  = landsState[i].pmax.toFixed(1);
  if (el(`dLabel_${i}`))     el(`dLabel_${i}`).textContent     = landsState[i].dconst.toFixed(2);
  if (el(`amaxLabel_${i}`))  el(`amaxLabel_${i}`).textContent  = landsState[i].alpha_max.toFixed(2);
  if (el(`sTLabel_${i}`))    el(`sTLabel_${i}`).textContent    = landsState[i].sT.toFixed(2);
  if (el(`rhoLabel_${i}`))   el(`rhoLabel_${i}`).textContent   = `${landsState[i].rho}`;
}

function renderLands(){
  const container = el("landsContainer");
  container.innerHTML = "";

  landsState.forEach((land, i) => {
    const card = document.createElement("div");
    card.className = "control";

    card.innerHTML = `
      <h4>${land.name}</h4>

      <div class="row">
        <div class="labelrow"><span>Name</span><span class="small"></span></div>
        <input id="landName_${i}" type="text" value="${land.name}" />
      </div>

      <div class="row">
        <div class="labelrow"><span>Share (%)</span><span id="shareLabel_${i}" class="small"></span></div>
        <input id="share_${i}" type="range" min="0" max="100" step="1" value="${land.share}">
      </div>

      <div class="row">
        <div class="labelrow"><span>Recovery model</span><span id="recLabel_${i}" class="small"></span></div>
        <select id="recovery_${i}">
          <option value="Constant alpha" ${land.recovery==="Constant alpha"?"selected":""}>Constant α</option>
          <option value="Logistic alpha(S)" ${land.recovery==="Logistic alpha(S)"?"selected":""}>Logistic α(S)</option>
        </select>
      </div>

      <div class="row" id="alphaConstRow_${i}">
        <div class="labelrow"><span>α (constant)</span><span id="alphaLabel_${i}" class="small"></span></div>
        <input id="alpha_${i}" type="range" min="0" max="1" step="0.01" value="${land.alpha}">
      </div>

      <div id="alphaLogisticBlock_${i}">
        <div class="row">
          <div class="labelrow"><span>αmax</span><span id="amaxLabel_${i}" class="small"></span></div>
          <input id="amax_${i}" type="range" min="0" max="1" step="0.01" value="${land.alpha_max}">
        </div>
        <div class="row">
          <div class="labelrow"><span>S_T</span><span id="sTLabel_${i}" class="small"></span></div>
          <input id="sT_${i}" type="range" min="0" max="1" step="0.01" value="${land.sT}">
        </div>
        <div class="row">
          <div class="labelrow"><span>ρ</span><span id="rhoLabel_${i}" class="small"></span></div>
          <input id="rho_${i}" type="range" min="1" max="200" step="1" value="${land.rho}">
        </div>
      </div>

      <div class="row">
        <div class="labelrow"><span>S₀</span><span id="s0Label_${i}" class="small"></span></div>
        <input id="s0_${i}" type="range" min="0" max="1" step="0.01" value="${land.s0}">
      </div>

      <div class="row">
        <div class="labelrow"><span>P_max</span><span id="pmaxLabel_${i}" class="small"></span></div>
        <input id="pmax_${i}" type="range" min="0" max="40" step="0.5" value="${land.pmax}">
      </div>

      <div class="row">
        <div class="labelrow"><span>D_const</span><span id="dLabel_${i}" class="small"></span></div>
        <input id="d_${i}" type="range" min="0" max="1" step="0.01" value="${land.dconst}">
      </div>
    `;

    container.appendChild(card);

    const nameInp  = el(`landName_${i}`);
    const shareInp = el(`share_${i}`);
    const alphaInp = el(`alpha_${i}`);
    const s0Inp    = el(`s0_${i}`);
    const pmaxInp  = el(`pmax_${i}`);
    const dInp     = el(`d_${i}`);
    const recSel   = el(`recovery_${i}`);
    const amaxInp  = el(`amax_${i}`);
    const sTInp    = el(`sT_${i}`);
    const rhoInp   = el(`rho_${i}`);

    const alphaConstRow = el(`alphaConstRow_${i}`);
    const alphaLogBlock = el(`alphaLogisticBlock_${i}`);

    function applyRecoveryVisibility(){
      const isLog = (landsState[i].recovery === "Logistic alpha(S)");
      alphaConstRow.style.display = isLog ? "none" : "block";
      alphaLogBlock.style.display = isLog ? "block" : "none";
      el(`recLabel_${i}`).textContent = isLog ? "α(S)" : "α";
    }

    const updateFromUI = () => {
      landsState[i].name = nameInp.value || `Land ${i+1}`;
      landsState[i].share = +shareInp.value;

      landsState[i].recovery = recSel.value;
      applyRecoveryVisibility();

      landsState[i].alpha = +alphaInp.value;
      landsState[i].alpha_max = +amaxInp.value;
      landsState[i].sT = +sTInp.value;
      landsState[i].rho = +rhoInp.value;

      landsState[i].s0 = +s0Inp.value;
      landsState[i].pmax = +pmaxInp.value;
      landsState[i].dconst = +dInp.value;

      card.querySelector("h4").textContent = landsState[i].name;
      setLandLabels(i);
      triggerSim();
    };

    [nameInp, shareInp, alphaInp, amaxInp, sTInp, rhoInp, s0Inp, pmaxInp, dInp]
      .forEach(inp => inp.addEventListener("input", updateFromUI));

    recSel.addEventListener("change", updateFromUI);

    applyRecoveryVisibility();
    setLandLabels(i);
  });
}

// Add/remove land
el("addLandBtn").addEventListener("click", () => {
  if (landsState.length >= 10) return;
  landsState.push({
    name: `Land ${landsState.length + 1}`,
    share: Math.round(100 / (landsState.length + 1)),
    alpha: 0.20,
    s0: 0.80,
    pmax: 10.0,
    dconst: landsState[0]?.dconst ?? 0.10,
    recovery: "Constant alpha",
    alpha_max: 0.25,
    sT: 0.20,
    rho: 50
  });
  renderLands();
  triggerSim();
});

el("removeLandBtn").addEventListener("click", () => {
  if (landsState.length <= 1) return;
  landsState.pop();
  renderLands();
  triggerSim();
});

// ---- plotting ----
const commonLayout = (title, ytitle) => ({
  title: {text: title, font: {size: 16}},
  margin: {l: 58, r: 6, t: 28, b: 28},
  paper_bgcolor: "rgba(0,0,0,0)",
  plot_bgcolor: "rgba(0,0,0,0)",
  xaxis: {tickfont: {size: 12}},
  yaxis: {title: {text: ytitle, font: {size: 12}}, tickfont: {size: 12}},
  legend: {font: {size: 12}, orientation: "h", y: -0.35}
});

function showSecondary(show){
  const card = el("secondaryCard");
  const content = el("content");

  if (show) {
    card.style.display = "block";
    content.style.gridTemplateRows = "1fr 0.7fr"; // Soil + secondary
    setTimeout(() => Plotly.Plots.resize("plotMain"), 0);
  } else {
    card.style.display = "none";
    content.style.gridTemplateRows = "1fr"; // 🔥 Soil takes ALL space
  }

  setTimeout(() => Plotly.Plots.resize("plotSoil"), 0);
}


async function runSim(){
  setGlobalLabels();

  const sumShares = Math.max(landsState.reduce((a,l)=>a+l.share,0), 1e-9);

  const payload = {
    T_max: +el("tmax").value,
    n_points: +el("n").value,
    population_growth_rate: +el("pop").value,
    lands: landsState.map(l => ({
      name: l.name,
      alpha: l.alpha,
      S0: l.s0,
      scenario_name: "Constant degradation D",
      deg_params: {"D_const": l.dconst},
      land_fraction: l.share / sumShares,
      P_max: l.pmax,
      recovery_name: l.recovery,
      recovery_params: (l.recovery === "Logistic alpha(S)")
        ? { alpha_max: l.alpha_max, rho: l.rho, S_T: l.sT }
        : {},
    }))
  };

  const resp = await fetch("/api/simulate", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(payload)
  });

  const data = await resp.json();
  const t = data.t;

  // Soil always
  const soilTraces = [];
  for (let i=0; i<data.land_names.length; i++){
    soilTraces.push({x:t, y:data.soils[i], type:"scatter", name:data.land_names[i], line:{width:3}});
  }
  soilTraces.push({x:t, y:data.weighted_soil, type:"scatter", name:"Weighted", line:{width:3, dash:"dash"}});
  Plotly.react("plotSoil", soilTraces, commonLayout("Soil", "Index"), {displayModeBar:false});

  // Secondary plot depends on dropdown
  if (selectedPlot === "none"){
    showSecondary(false);
    Plotly.purge("plotMain");
    return;
  }

  showSecondary(true);

  if (selectedPlot === "prod"){
    const prodTraces = [];
    for (let i=0; i<data.land_names.length; i++){
      prodTraces.push({x:t, y:data.production_by_land[i], type:"scatter", name:data.land_names[i], line:{width:3}});
    }
    prodTraces.push({x:t, y:data.total_production, type:"scatter", name:"Total", line:{width:3, dash:"dash"}});
    Plotly.react("plotMain", prodTraces, commonLayout("Production", "Tonnes"), {displayModeBar:false});
  }

  else if (selectedPlot === "pop"){
    Plotly.react("plotMain",
      [{x:t, y:data.population, type:"scatter", name:"Population", line:{width:3}}],
      commonLayout("Population","People"),
      {displayModeBar:false}
    );
  }

  else if (selectedPlot === "ssr"){
    Plotly.react("plotMain",
      [{x:t, y:data.self_sufficiency_ratio, type:"scatter", name:"SSR", line:{width:3}}],
      commonLayout("Self-sufficiency","%"),
      {displayModeBar:false}
    );
  }

  else if (selectedPlot === "inc"){
    Plotly.react("plotMain",
      [{x:t, y:data.average_real_income, type:"scatter", name:"Real income", line:{width:3}}],
      commonLayout("Real income","£ (real)"),
      {displayModeBar:false}
    );
  }

  else if (selectedPlot === "aff"){
    Plotly.react("plotMain",
      [{x:t, y:data.affordability_index, type:"scatter", name:"Affordability", line:{width:3}}],
      commonLayout("Affordability","Index"),
      {displayModeBar:false}
    );
  }

  else if (selectedPlot === "deg"){
    const degTraces = [];
    for (let i=0; i<data.land_names.length; i++){
      degTraces.push({x:t, y:data.degradations[i], type:"scatter", name:data.land_names[i], line:{width:3}});
    }
    Plotly.react("plotMain", degTraces, commonLayout("Degradation D(t)","D"), {displayModeBar:false});
  }

  else if (selectedPlot === "price"){
    Plotly.react("plotMain",
      [{x:t, y:data.price, type:"scatter", name:"Price", line:{width:3}}],
      commonLayout("Price","p"),
      {displayModeBar:false}
    );
  }

  else if (selectedPlot === "harvest"){
    Plotly.react("plotMain",
      [{x:t, y:data.total_harvest, type:"scatter", name:"Harvest", line:{width:3}}],
      commonLayout("Total harvest","Tonnes"),
      {displayModeBar:false}
    );
  }

  // ensure correct resize after updates
  setTimeout(() => {
    Plotly.Plots.resize("plotSoil");
    if (selectedPlot !== "none") Plotly.Plots.resize("plotMain");
  }, 0);
}

// Debounce
let timer = null;
function triggerSim(){
  clearTimeout(timer);
  timer = setTimeout(runSim, 140);
}

// global sliders
["tmax","pop","n"].forEach((id) => el(id).addEventListener("input", triggerSim));

// dropdown
el("plotSelect").addEventListener("change", (e) => {
  selectedPlot = e.target.value;
  runSim();
});

// initial
renderLands();
runSim();

// resize handler
window.addEventListener("resize", () => {
  Plotly.Plots.resize("plotSoil");
  if (selectedPlot !== "none") Plotly.Plots.resize("plotMain");
});
</script>
</body>
</html>
